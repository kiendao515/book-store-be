server:
  port: ${PORT:8081}
  address: ${SERVER_URL:0.0.0.0}

spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017}
      auto-index-creation: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:xxx@gmail.com}
    password: ${MAIL_PASSWORD:xxx}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.ssl.protocols: TLSv1.2
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 5MB
#  jpa:
#    show-sql: true
springdoc:
  swagger-ui:
    csrf:
      enabled: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:secret_key}
      expiration: ${JWT_EXPIRATION:86400000}
#logging:
#  level:
#    org:
#      springframework:
#        data:
#          mongodb:
#            core:
#              MongoTemplate: DEBUG

aws:
  endpointUrl: ${ENDPOINT:https://abc.com}
  accessKey: ${ACCESS_KEY:jddhdd}
  secretKey: ${SECRET_KEY:dgdghd}
  bucketName: ${BUCKET_NAME:abc}
  region: ${REGION:ap-south-1}
app:
  client:
    url: ${CLIENT_URL:http://localhost:3000}
  domain:
    url: ${DOMAIN_URL:http://localhost:8080}